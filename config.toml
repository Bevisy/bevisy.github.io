baseurl = "https://bevisy.github.io"
enableRobotsTXT = true
locale = "en-us"
theme = "hugo-theme-stack"
paginate = 5.0
title = "BBZ's Blog"
DefaultContentLanguage = "en"

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = [
    "post"
]
featuredImageField = "image"
rssFullContent = true
favicon = "img/avatar.png"

[params.footer]
since = 2020.0

[params.dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[params.sidebar]
subtitle = "春风得意马蹄疾，一日看尽长安花"
avatar = "img/avatar.png"

[params.article]
math = true
toc = true

[params.article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

[params.comments]
enabled = true
provider = "giscus"

[params.comments.giscus]
repo = "bevisy/bevisy.github.io"
repoID = "MDEwOlJlcG9zaXRvcnkyMzUxMzg1ODY="
category = "Announcements"
categoryID = "DIC_kwDODgPuGs4DC6o2"
mapping = "pathname"
strict = false
reactionsEnabled = true
emitMetadata = false
inputPosition = "bottom"
lightTheme = "light"
darkTheme = "dark"
lang = "zh-CN"
loading = "lazy"

[params.widgets]
homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "tag-cloud", params = { limit = 10 } }
]
page = [
    { type = "toc" }
]

[params.opengraph]

[params.opengraph.twitter]
card = "summary_large_image"

[params.defaultImage]

[params.defaultImage.opengraph]
enabled = true
local = false
src = "img/og-default.jpg"

[params.colorScheme]
toggle = true
default = "auto"

[params.imageProcessing]

[params.imageProcessing.cover]
enabled = true

[params.imageProcessing.content]
enabled = true

[menu]

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = -100.0
pre = "home"

[[menu.main]]
identifier = "about"
name = "About"
url = "about"
weight = -90.0
pre = "user"

[[menu.main]]
identifier = "archives"
name = "Archives"
url = "archives"
weight = -70.0
pre = "archives"

[[menu.main]]
identifier = "search"
name = "Search"
url = "search"
weight = -60.0
pre = "search"

[related]
includeNewer = true
threshold = 60.0
toLower = false

[[related.indices]]
name = "tags"
weight = 100.0

[[related.indices]]
name = "categories"
weight = 200.0

[markup]

[markup.highlight]
noClasses = false